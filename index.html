<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زيارة موريتانيا V23</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0f172a;color:#fff}
header{background:#1e3a8a;padding:15px;text-align:center;position:sticky;top:0}
.langs{margin-top:10px;display:flex;gap:8px;justify-content:center}
.langs button{padding:7px 15px;border-radius:20px;border:1px solid #38bdf8;background:transparent;color:#fff}
.langs button.active{background:#38bdf8;color:#000;font-weight:bold}
.hero{padding:30px;text-align:center}
.hero h1{color:#7dd3fc;font-size:26px;margin-bottom:10px}
.card{background:#1e293b;margin:15px;padding:15px;border-radius:12px}
.btn{display:inline-block;margin-top:12px;padding:10px 20px;background:#38bdf8;color:#000;border-radius:8px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<header>
<div id="t-title">🇲🇷 موريتانيا سياحة V23</div>
<div class="langs">
<button onclick="setLang('ar')" id="b-ar" class="active">العربية</button>
<button onclick="setLang('en')" id="b-en">English</button>
<button onclick="setLang('fr')" id="b-fr">Français</button>
</div>
</header>
<div class="hero">
<h1 id="h1">أهلاً
